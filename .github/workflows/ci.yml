name: v4 CI
# Trimmed: one required leg (3.11 + pinned deps = local env) plus one
# experimental numpy-2.0 leg that never fails the run. No 3.10 leg
# (codebase uses no 3.11-only syntax), no tag runs, and a newer push
# cancels the older run on the same branch.
on:
  push:
    branches: ["main", "codex/*"]
    tags-ignore: ["*"]
  pull_request:

concurrency:
  group: v4-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    # NumPy 2.0 leg is experimental until the suite is proven green on it;
    # experimental legs don't fail the run (and don't send failure mail).
    continue-on-error: ${{ matrix.numpy-version == '2.0.0' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
        numpy-version: ["1.26.4", "2.0.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==${{ matrix.numpy-version }}" pytest
          if [ "${{ matrix.numpy-version }}" = "2.0.0" ]; then
            pip install scipy scikit-learn matplotlib joblib pandas
          else
            # Pinned to locally verified versions; latest majors drifted
            # (sklearn 1.2.2 -> 1.7.x etc.) and broke the suite.
            pip install "scipy==1.11.4" "scikit-learn==1.2.2" "matplotlib==3.8.0" "joblib==1.2.0" "pandas==2.1.4"
          fi
          pip install -e . || pip install -r requirements.txt
      - name: Run pytest
        run: python -m pytest tests -q
      - name: Unified CLI smoke (no LLM, no hardware)
        run: |
          python run.py --help
          python run.py crossval --help
          python run.py embedded --help
          python run.py pipeline --help
          python build_docs.py --help
          python -c "import sys; sys.path.insert(0,'reports'); import figstyle, make_figures"
      - name: No absolute paths / legacy batch deps
        run: |
          python - <<'PY'
          import pathlib, re, sys
          root = pathlib.Path('.')
          pat = re.compile(r'[A-Z]:\\\\')
          bad = []
          for p in list((root/'hvac_pid').rglob('*.py')) + list((root/'reports').glob('check_math.py')) + list((root/'reports').glob('dump_s4_numbers.py')) + list((root/'reports').glob('make_s4_figures.py')) + [root/'hvac_pid/validation.py', root/'hvac_pid/embedded_demo.py']:
              if not p.exists(): continue
              t = p.read_text(encoding='utf-8', errors='ignore')
              for i, line in enumerate(t.splitlines(), 1):
                  if pat.search(line) and 'HlinForest' not in line:
                      bad.append(f'{p}:{i}:{line.strip()[:160]}')
          # canonical sealed batch is archive/outputs_review_v3; the old transitional
          # batch must not reappear as code default (docs/notes history excepted)
          t = (root/'hvac_pid/embedded_demo.py').read_text(encoding='utf-8')
          assert 'artifact_dir' in t, 'embedded_demo must support explicit --artifact-dir'
          assert 'outputs_adaptive_final_v2' not in t, 'stale batch still referenced in embedded_demo.py'
          t2 = (root/'hvac_pid/validation.py').read_text(encoding='utf-8')
          assert 'D:\\\\modelica' not in t2 and 'C:\\\\OpenModelica' not in t2, 'validation.py must not hardcode Modelica paths'
          if bad:
              print('\n'.join(bad)); sys.exit(1)
          print('path check OK')
          PY
      - name: Dedup guards (no resurrected batches, no figure copies, size budget)
        run: |
          python - <<'PY'
          import hashlib, pathlib, sys
          root = pathlib.Path('.')
          # 1. removed batches must not come back as tracked files
          banned = ['outputs_adaptive_final_v2', 'archive/outputs_llm_matrix_v2',
                    'outputs_llm_agent_live', 'outputs_llm_agent_real',
                    'outputs_llm_agent/', 'report_assets']
          import subprocess
          tracked = subprocess.run(['git', '-c', 'core.quotepath=false', 'ls-files'], capture_output=True, text=True, cwd='.').stdout.splitlines()
          bad = [p for p in tracked if any(b in p.replace('\\', '/') for b in banned)]
          # archive/outputs_llm_agent_bailian is the kept exception
          bad = [p for p in bad if 'archive/outputs_llm_agent_bailian' not in p]
          assert not bad, f'resurrected dedup removals: {bad[:10]}'
          assert not (root/'outputs').exists() or True  # outputs/ is gitignored scratch
          # 2. single-source figures: no MD5 duplicates across the two figure dirs
          subs = [p for p in (root/'reports').iterdir() if p.is_dir() and p.name not in ('figures', 'legacy', '__pycache__')]
          assert len(subs) == 1, [p.name for p in subs]
          ha = {hashlib.md5(p.read_bytes()).hexdigest() for p in (root/'reports'/'figures').glob('*.png')}
          hb = [hashlib.md5(p.read_bytes()).hexdigest() for p in (subs[0]/'figures').glob('*.png')]
          dup = ha.intersection(hb)
          assert not dup, f'{len(dup)} duplicated figures across single-source boundary'
          # 3. tracked size budget 100 MB (sealed evidence + matrices are the
          # product; measured with quotepath=false so non-ASCII names count)
          total = sum(pathlib.Path(p).stat().st_size for p in tracked if pathlib.Path(p).exists())
          print(f'tracked bytes: {total/1048576:.1f} MB in {len(tracked)} files')
          assert total < 100*1048576, f'tracked size {total/1048576:.1f} MB exceeds 100 MB budget'
          print('dedup guards OK')
          PY
      - name: Report consistency (v4 manifest exists)
        run: |
          test -f experiments/manifests/v4.yaml
          test -f experiments/manifests/archive_map.csv
          test -f hvac_pid/safety.py
          test -f hvac_pid/timebase.py
          test -f artifacts/README.md
          test -f run.py
          test -f build_docs.py
          test -f reports/figstyle.py
          test -f docs/README.md
